<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80">
  <!-- Signal Hunt logo — Mel spectrogram bars with a crosshair target -->

  <!-- Spectrogram frequency bars — rising then falling energy pattern -->
  <rect x="14" y="52" width="6" height="12" rx="1" fill="#f97316" opacity="0.35"/>
  <rect x="24" y="42" width="6" height="22" rx="1" fill="#f97316" opacity="0.5"/>
  <rect x="34" y="30" width="6" height="34" rx="1" fill="#f97316" opacity="0.65"/>
  <rect x="44" y="22" width="6" height="42" rx="1" fill="#f97316" opacity="0.8"/>
  <rect x="54" y="16" width="6" height="48" rx="1" fill="#f97316" opacity="0.95"/>
  <rect x="64" y="14" width="6" height="50" rx="1" fill="#f97316" opacity="1"/>
  <rect x="74" y="18" width="6" height="46" rx="1" fill="#f97316" opacity="0.9"/>
  <rect x="84" y="26" width="6" height="38" rx="1" fill="#f97316" opacity="0.7"/>
  <rect x="94" y="36" width="6" height="28" rx="1" fill="#f97316" opacity="0.55"/>
  <rect x="104" y="46" width="6" height="18" rx="1" fill="#f97316" opacity="0.4"/>
  <rect x="114" y="54" width="6" height="10" rx="1" fill="#f97316" opacity="0.3"/>

  <!-- Crosshair — the "hunt" targeting the signal -->
  <circle cx="67" cy="39" r="14" fill="none" stroke="#f97316" stroke-width="1.8" opacity="0.6"/>
  <line x1="67" y1="22" x2="67" y2="30" stroke="#f97316" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
  <line x1="67" y1="48" x2="67" y2="56" stroke="#f97316" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
  <line x1="50" y1="39" x2="58" y2="39" stroke="#f97316" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
  <line x1="76" y1="39" x2="84" y2="39" stroke="#f97316" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>

  <!-- Baseline -->
  <line x1="8" y1="68" x2="132" y2="68" stroke="#f97316" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>
