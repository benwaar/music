<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80">
  <!-- Bloom logo — small chiptune waveform blooming into a full waveform -->

  <!-- Left: small, tight square wave (the chiptune input) -->
  <polyline
    points="8,46 8,30 16,30 16,46 24,46 24,30 32,30 32,46"
    fill="none" stroke="#ec4899" stroke-width="2"
    stroke-linecap="square" stroke-linejoin="miter"
    opacity="0.6"/>

  <!-- Middle: expanding transition arrow -->
  <polyline points="40,38 50,38 47,34" fill="none" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <line x1="47" y1="42" x2="50" y2="38" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- Right: lush, tall, varied waveform (the bloomed production) -->
  <polyline
    points="58,48 58,20 66,20 66,52 74,52 74,16 82,16 82,54 90,54 90,22 98,22 98,50 106,50 106,24 114,24 114,48 122,48 122,28 130,28 130,46"
    fill="none" stroke="#ec4899" stroke-width="2.5"
    stroke-linecap="square" stroke-linejoin="miter"
    opacity="0.9"/>

  <!-- Baseline -->
  <line x1="8" y1="68" x2="132" y2="68" stroke="#ec4899" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>
