<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aerythen Ringtones | Music & Games AI Labs</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="container site-header">
      <h1>Aerythen Ringtones</h1>
      <p>
        Choose a ringtone or play all three in sequence.
      </p>
    </header>

    <main>
    <section class="container">
      <div class="audio-samples">
        <div class="audio-sample">
          <span class="audio-label">Retro</span>
          <audio controls preload="none" src="https://cdn.jsdelivr.net/gh/benwaar/music@main/rintones/aerythen-ringtone-retro.mp3"></audio>
        </div>
        <div class="audio-sample">
          <span class="audio-label">Classical</span>
          <audio controls preload="none" src="https://cdn.jsdelivr.net/gh/benwaar/music@main/rintones/aerythen-ringtone-classical.mp3"></audio>
        </div>
        <div class="audio-sample">
          <span class="audio-label">Default</span>
          <audio controls preload="none" src="https://cdn.jsdelivr.net/gh/benwaar/music@main/rintones/aerythen-ringtone.mp3"></audio>
        </div>
      </div>

      <div class="link-row link-row--spaced">
        <a href="index.html" class="link-secondary">&larr; Back to site</a>
      </div>
    </section>
    </main>

    <footer class="site-footer">
      <a href="https://linktr.ee/enostate" target="_blank" rel="noopener" title="Eno State — songs, sounds and synths"
        >Eno State</a
      >
      &middot;
      <a href="https://aerythen.com" target="_blank" rel="noopener" title="Aerythen — a Command Line Punk universe"
        >Aerythen</a
      >

  </body>
</html>
