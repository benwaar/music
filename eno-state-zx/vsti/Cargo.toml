[workspace]
members = [".", "plugin", "xtask"]
resolver = "2"

[package]
name = "eno-state-zx"
version = "0.1.0"
edition = "2021"
description = "Eno State ZX — 1-bit ZX Spectrum beeper synth engines"
license = "MIT"
repository = "https://github.com/benwaar/music"
homepage = "https://github.com/benwaar/music/tree/main/eno-state-zx"
keywords = ["audio", "synth", "beeper", "zx-spectrum", "chiptune"]
categories = ["multimedia::audio"]
exclude = ["plugin/", "xtask/"]

[lib]
name = "eno_state_zx"

[[bin]]
name = "eno-state-zx"
path = "src/main.rs"

[dependencies]
hound = "3"

[profile.release]
opt-level = 2
lto = true
strip = true
