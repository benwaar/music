[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "soundfile>=0.12",
    "torch>=2.0",
    "torchaudio>=2.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "py7zr>=0.20"]

[tool.setuptools.packages.find]
include = ["drift*"]
