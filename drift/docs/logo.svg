<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Drift logo — spectrogram bars dissolving into noise particles -->

  <!-- Left: solid spectrogram bars (the signal) -->
  <rect x="12" y="18" width="6" height="62" rx="1" fill="#f97316" opacity="0.95"/>
  <rect x="22" y="26" width="6" height="48" rx="1" fill="#f97316" opacity="0.90"/>
  <rect x="32" y="14" width="6" height="68" rx="1" fill="#f97316" opacity="0.85"/>
  <rect x="42" y="22" width="6" height="54" rx="1" fill="#f97316" opacity="0.80"/>
  <rect x="52" y="30" width="6" height="40" rx="1" fill="#f97316" opacity="0.75"/>

  <!-- Middle: bars breaking into pixels (the transition) -->
  <rect x="62" y="20" width="5" height="12" rx="1" fill="#f97316" opacity="0.65"/>
  <rect x="62" y="36" width="5" height="10" rx="1" fill="#f97316" opacity="0.60"/>
  <rect x="62" y="52" width="5" height="14" rx="1" fill="#f97316" opacity="0.55"/>
  <rect x="62" y="70" width="5" height="8"  rx="1" fill="#f97316" opacity="0.50"/>

  <rect x="71" y="24" width="4" height="8" rx="1" fill="#f97316" opacity="0.50"/>
  <rect x="71" y="40" width="4" height="6" rx="1" fill="#f97316" opacity="0.45"/>
  <rect x="71" y="56" width="4" height="8" rx="1" fill="#f97316" opacity="0.40"/>
  <rect x="71" y="68" width="4" height="6" rx="1" fill="#f97316" opacity="0.35"/>

  <!-- Right: scattered noise particles (the diffusion) -->
  <circle cx="84"  cy="22" r="2.5" fill="#f97316" opacity="0.40"/>
  <circle cx="90"  cy="38" r="2"   fill="#f97316" opacity="0.35"/>
  <circle cx="86"  cy="54" r="2.5" fill="#f97316" opacity="0.30"/>
  <circle cx="92"  cy="70" r="2"   fill="#f97316" opacity="0.35"/>
  <circle cx="82"  cy="44" r="1.5" fill="#f97316" opacity="0.25"/>

  <circle cx="100" cy="28" r="2"   fill="#f97316" opacity="0.28"/>
  <circle cx="96"  cy="48" r="1.5" fill="#f97316" opacity="0.22"/>
  <circle cx="102" cy="62" r="2"   fill="#f97316" opacity="0.25"/>
  <circle cx="98"  cy="76" r="1.5" fill="#f97316" opacity="0.20"/>

  <circle cx="110" cy="34" r="1.5" fill="#f97316" opacity="0.18"/>
  <circle cx="108" cy="56" r="1.5" fill="#f97316" opacity="0.15"/>
  <circle cx="112" cy="42" r="1"   fill="#f97316" opacity="0.14"/>
  <circle cx="114" cy="68" r="1"   fill="#f97316" opacity="0.12"/>

  <circle cx="122" cy="40" r="1"   fill="#f97316" opacity="0.10"/>
  <circle cx="120" cy="58" r="1"   fill="#f97316" opacity="0.08"/>
  <circle cx="126" cy="50" r="0.8" fill="#f97316" opacity="0.07"/>

  <!-- Baseline — thin line anchoring it -->
  <line x1="10" y1="86" x2="130" y2="86" stroke="#f97316" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>
