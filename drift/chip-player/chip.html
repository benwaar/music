        function playScore() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const tempo = 140; // Adjust tempo if needed
            const secondsPerBeat = 60 / tempo;
            let currentTime = audioCtx.currentTime + 0.1;

            score.forEach(([noteName, beats]) => {
                const duration = beats * secondsPerBeat;

                if (NOTES[noteName]) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    // Classic 8-bit square wave chiptune sound
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(NOTES[noteName], currentTime);

                    // Crisp envelope envelope to avoid audio clicks
                    gain.gain.setValueAtTime(0.12, currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, currentTime + duration * 0.85);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(currentTime);
                    osc.stop(currentTime + duration);
                }

                currentTime += duration;
            });
        }
